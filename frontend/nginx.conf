# ShramSetu frontend — production nginx.
#
# - Serves the pre-built SPA from /usr/share/nginx/html (Vite build output).
# - Proxies /api and /api/* to the Node.js backend (compose service name
#   "server" on the docker network; port 8000).
# - No CORS headers needed (same origin).
# - HTTPS on 443: terminate TLS with certs mounted at /etc/nginx/certs/.
#   Place cert.pem and key.pem there (or use certbot/acme-companion to manage them).
# - HTTP→HTTPS redirect on port 80.

server {
    listen 80;
    server_name _;
    # Redirect all HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS certificates — mount at /etc/nginx/certs/ in production.
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Uploads are capped at 10 MB by the API; nginx's 1 MB default would reject
    # a photographed document before Express ever saw it.
    client_max_body_size 12m;

    # ── Security headers ─────────────────────────────────────────────────
    # Set on the origin that serves HTML, not on the JSON API: `helmet` there
    # cannot protect the pages a worker actually loads.
    #
    # script-src 'self' blocks injected third-party scripts. 'unsafe-inline' is
    # limited to STYLES because React renders style attributes; Google Fonts is
    # the only external origin the app loads (see index.html). connect-src is
    # first-party because /api is proxied below, and frame-ancestors 'none'
    # stops the worker wallet from being framed for clickjacking.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The microphone is required (voice complaint dictation); camera and
    # location are unused, so they stay hard-off even for a dependency.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Fingerprinted build output can be cached forever; the shell and the
    # service worker must revalidate or a phone keeps a stale bundle.
    # (Each location re-declares the headers: add_header is not inherited once
    # a location declares one of its own.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: everything not a static file goes to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — point at the Node backend.
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Keep long-lived websocket/health connections alive.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Security: hide nginx version.
    server_tokens off;
}
