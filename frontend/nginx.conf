# ShramSetu frontend — production nginx.
#
# - Serves the pre-built SPA from /usr/share/nginx/html (Vite build output).
# - Proxies /api and /api/* to the Node.js backend (compose service name
#   "server" on the docker network; port 8000).
# - No CORS headers needed (same origin).
# - HTTPS on 443: terminate TLS with certs mounted at /etc/nginx/certs/.
#   Place cert.pem and key.pem there (or use certbot/acme-companion to manage them).
# - HTTP→HTTPS redirect on port 80.

server {
    listen 80;
    server_name _;
    # Redirect all HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS certificates — mount at /etc/nginx/certs/ in production.
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # SPA fallback: everything not a static file goes to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — point at the Node backend.
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Keep long-lived websocket/health connections alive.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Security: hide nginx version.
    server_tokens off;
}
